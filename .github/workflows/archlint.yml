name: ArchLint

on:
  pull_request:

jobs:
  archlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ArchLint is checking its own package, so install its dependencies first.
      - run: npm ci
      - run: npx archlint-ai check --base origin/${{ github.event.repository.default_branch }}
