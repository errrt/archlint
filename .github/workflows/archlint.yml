name: ArchLint

on:
  pull_request:

jobs:
  archlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Explicit --package avoids resolving this repository's own local bin.
      - run: npx --yes --package=archlint-ai@0.1.1 -- archlint-ai check --base origin/${{ github.event.repository.default_branch }}
