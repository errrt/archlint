name: Bug report
description: Report a reproducible problem with ArchLint
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: ArchLint version
      description: Run `npx archlint-ai --version` if you are unsure.
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your operating system and Node.js version.
      placeholder: macOS 15, Node.js 22
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest example that consistently shows the problem. Remove secrets and private code.
      placeholder: |
        1. Create .archlint.yml with ...
        2. Change ...
        3. Run npx archlint-ai check
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and output
      render: shell
    validations:
      required: true

